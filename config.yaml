# ─────────────────────────────────────────────────────────────────────────────
# Institutional equity screener — pre-registered configuration.
# Every modelling choice lives here so runs are reproducible and auditable.
# Validated on load by screener/config.py (Pydantic): e.g. sleeve weights MUST
# sum to 1.0 and the normalization hierarchy MUST end at cross_sectional.
# ─────────────────────────────────────────────────────────────────────────────

universe:
  name: sp500
  source: wikipedia          # the only implemented source

data:
  provider: edgar            # edgar (SEC XBRL, free, full history) | fmp | yfinance
  fmp_api_key_env: FMP_API_KEY
  edgar_contact: adilip407@gmail.com   # SEC fair-access policy requires a contact UA
  cache_dir: .cache
  # NOTE: point-in-time gating by SEC filing date is unconditional (see
  # factors.pit_fundamentals) -- there is no flag to turn it off.

# Descriptor weights within each sleeve. Each descriptor is sector-neutral
# z-scored FIRST, then blended with these weights (renormalized over whichever
# descriptors a name actually has), then the blend is re-standardized. Keys must
# match the factor columns in screener/factors.py:SLEEVES (Pydantic-validated).
factors:
  value:      { ep: 1.0, bp: 1.0, fcf_yield: 1.0, ev_ebitda_inv: 1.0 }
  quality:    { roe: 1.0, roic: 1.0, gross_profitability: 1.0, de_inv: 1.0 }
  momentum:   { momentum: 1.0 }

# Composite sleeve weights — MUST sum to 1.0 (Pydantic-validated)
sleeve_weights:
  value: 0.3333
  quality: 0.3333
  momentum: 0.3334

weighting:
  method: inverse_vol        # inverse_vol | equal | custom
  vol_lookback_months: 12    # trailing window for each sleeve's return vol
  burn_in_months: 12         # equal-weight until a full trailing window exists (no look-ahead)
  max_sleeve_weight: 0.50    # cap a sleeve; redistribute excess proportionally

normalization:
  method: mad                # robust z = (x - median) / (1.4826 * MAD)
  clip: 5.0                  # clip at +/- 5 MAD
  hierarchy:                 # finest-first; roll UP to broader (larger-n) groups
    - { level: industry_group, min_n: 20 }
    - { level: sector,         min_n: 20 }
    - { level: cross_sectional }

quality_gates:
  pe_bounds: [0.0, 500.0]
  xs_mad_flag: 10.0          # flag/winsorize values > 10 MAD from cross-sectional median
  drop_negative_book_bp: true      # negative book value -> drop from B/P
  drop_negative_ebitda_ev: true    # negative EBITDA -> NaN EV/EBITDA (no "cheap" distress)

portfolio:
  weighting: equal           # equal | market_cap | inverse_vol
  n_quantiles: 5
  select: top_decile         # top_decile | top_n
  top_n: 50
  hard_filters:
    min_market_cap: 1.0e9
    positive_earnings: true

backtest:
  start: "2015-01-01"
  end: "2024-12-31"
  frequencies_to_test: [monthly, quarterly]

costs:
  commission_bps: 5.0             # per side, charged per unit of turnover
  spread_bps: 10.0                # per side, per unit of turnover (large-cap S&P 500)
  short_rebate_bps_annual: 25.0   # stock-borrow rate PER YEAR on the short notional,
                                  # accrued per rebalance (general collateral, large caps)

output:
  duckdb_path: outputs/screener.duckdb
  export_dir: outputs

# Multi-asset building blocks. Bonds & commodities are liquid ETF proxies (the
# equity factor engine doesn't apply to them, and free per-security data doesn't
# exist) — they enter only in the mean-variance / CAPM allocation, not the screen.
asset_classes:
  equity_proxy: SPY
  bond_etfs: [AGG, TLT, IEF, LQD, HYG, TIP]        # aggregate, long/interm. Treasuries, IG, HY, TIPS
  commodity_etfs: [GLD, SLV, USO, DBC, DBA, CPER]  # gold, silver, oil, broad, agriculture, copper

# Dividend-income screen (yield + sustainability). Yield from trailing-12m
# dividends; payout ratio from EDGAR net income (already pulled for the factors).
dividend:
  min_yield: 0.0
  max_payout: 0.90       # drop names paying out > 90% of earnings (unsustainable)
  top_n: 30
