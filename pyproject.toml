[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-screener"
version = "0.1.0"
description = "Institutional-grade factor-based S&P 500 equity screener & factor research engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "statsmodels>=0.14",
  "pyyaml>=6.0",
  "pydantic>=2.5",
  "duckdb>=0.10",
  "pyarrow>=14.0",
  "requests>=2.31",
  "yfinance>=0.2.40",
  "matplotlib>=3.7",
  "lxml>=5.0",
  "pandas_datareader>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "responses>=0.25", "ruff>=0.5"]
dashboard = ["streamlit>=1.33"]

[tool.setuptools.packages.find]
include = ["screener*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
  "integration: hits live APIs (FMP / yfinance / Ken French); excluded from CI",
]
